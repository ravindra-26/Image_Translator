
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English to Telugu Translator</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<link rel="stylesheet" href="index.css">
</head>

<body>

<div class="container">

    <h1>Image Translator</h1>

    <p class="subtitle">
        Convert English text in images into Telugu
    </p>

    <div class="upload-box">

        <h3>Upload Your Image</h3>

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
        >

        <br>

        <img id="preview" alt="Image preview">

        <br>

        <button id="translateBtn" disabled>
            Extract & Translate
        </button>

    </div>

    <div class="result">

        <h3>English Text</h3>

        <textarea
            id="english"
            placeholder="Extracted English text..."
        ></textarea>

    </div>

    <div class="result">

        <h3>Telugu Translation</h3>

        <textarea
            id="telugu"
            lang="te"
            placeholder="Telugu translation..."
        ></textarea>

        <div class="actions">

            <button id="copyBtn">
                Copy Telugu
            </button>

            <button id="translateAgainBtn">
                Translate Again
            </button>

            <button id="clearBtn">
                Clear All
            </button>

        </div>

    </div>

    <p id="status" role="status" aria-live="polite"></p>

</div>

<script>

// Get HTML elements
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const english = document.getElementById("english");
const telugu = document.getElementById("telugu");
const status = document.getElementById("status");
const translateBtn = document.getElementById("translateBtn");

let selectedImage = null;
let imageUrl = null;
let busy = false;

// IMAGE UPLOAD
imageInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "Please select an image.";
        return;
    }

    if (imageUrl) URL.revokeObjectURL(imageUrl);

    selectedImage = file;
    imageUrl = URL.createObjectURL(file);

    preview.src = imageUrl;
    preview.style.display = "block";

    english.value = "";
    telugu.value = "";

    translateBtn.disabled = false;
    status.textContent = "Image uploaded successfully.";

});

// EXTRACT TEXT AND TRANSLATE
translateBtn.addEventListener("click", processImage);

async function processImage() {

    if (!selectedImage || busy) return;

    busy = true;
    translateBtn.disabled = true;

    try {

        status.textContent = "Extracting English text...";

        const result = await Tesseract.recognize(
            selectedImage,
            "eng",
            {
                logger: function(info) {

                    if (info.status === "recognizing text") {

                        const progress =
                            Math.round(info.progress * 100);

                        status.textContent =
                            "OCR Progress: " + progress + "%";
                    }
                }
            }
        );

        const extractedText = result.data.text.trim();

        if (!extractedText) {
            throw new Error("No text found in the image.");
        }

        english.value = extractedText;

        // Translate extracted text
        await translateText();

    } catch(error) {

        console.error(error);
        status.textContent = error.message || "Something went wrong.";

    } finally {

        busy = false;
        translateBtn.disabled = !selectedImage;

    }
}

// TRANSLATION API
async function translateText() {

    const text = english.value.trim();

    if (!text) {
        status.textContent = "Please enter English text.";
        return;
    }

    status.textContent = "Translating into Telugu...";

    const chunks = text.match(/[\s\S]{1,450}/g) || [];

    const translatedChunks = [];

    for (let i = 0; i < chunks.length; i++) {

        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(chunks[i]) +
            "&langpair=en|te";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Translation API request failed.");
        }

        const data = await response.json();

        if (data.responseStatus !== 200 ||
            !data.responseData?.translatedText) {
            throw new Error("Translation failed.");
        }

        translatedChunks.push(
            data.responseData.translatedText
        );
    }

    telugu.value = translatedChunks.join(" ");

    status.textContent = "Translation completed!";

}

// TRANSLATE AGAIN
document.getElementById("translateAgainBtn")
.addEventListener("click", async function() {

    if (busy) return;

    busy = true;

    try {
        await translateText();
    } catch(error) {
        status.textContent = error.message;
    } finally {
        busy = false;
    }

});

// COPY TELUGU TEXT
document.getElementById("copyBtn")
.addEventListener("click", async function() {

    if (!telugu.value.trim()) {
        status.textContent = "No translation to copy.";
        return;
    }

    try {
        await navigator.clipboard.writeText(telugu.value);
        status.textContent = "Telugu text copied!";
    } catch(error) {
        status.textContent = "Unable to copy text.";
    }

});

// CLEAR ALL
document.getElementById("clearBtn")
.addEventListener("click", function() {

    if (imageUrl) URL.revokeObjectURL(imageUrl);

    imageInput.value = "";
    preview.removeAttribute("src");
    preview.style.display = "none";

    selectedImage = null;
    imageUrl = null;

    english.value = "";
    telugu.value = "";

    translateBtn.disabled = true;
    status.textContent = "";

});

</script>

</body>
</html>
